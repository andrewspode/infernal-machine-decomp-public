# Publishes the objdiff progress reports for decomp.dev. CI cannot build this project (that needs the
# original executables), so the reports are generated by the export from verified local builds and
# committed as progress/<version>/report.json; this workflow only uploads them, in the dtk-template
# convention (one artifact `<version>_report` per version, holding `report.json` at its root).
name: Progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Upload the 1.2 progress report
        uses: actions/upload-artifact@v4
        with:
          name: indy3d-v1.2_report
          path: progress/indy3d-v1.2/report.json
          if-no-files-found: error

      - name: Upload the 1.0 progress report
        uses: actions/upload-artifact@v4
        with:
          name: indy3d-v1.0_report
          path: progress/indy3d-v1.0/report.json
          if-no-files-found: error
