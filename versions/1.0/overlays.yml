# The 1.0 overlays (README.md, "Versions"). The shared tree (Jones3D/, Libs/) is the 1.2 source; every other
# file under versions/1.0/ is a complete 1.0 copy of the shared file at the same path below the repository root,
# used instead of it by the 1.0 build (`ninja v1.0-*`).
#
# `base` is the git blob id (`git hash-object <shared file>`) of the shared 1.2 file the overlay is paired with.
# tests/test_version_overlays.py fails when the shared file no longer has that id: a change to the 1.2 source has
# to be carried into the 1.0 overlay (or shown not to apply to 1.0), then `base` updated. `git show <base>` gives
# the 1.2 text the overlay was last checked against, so `git diff <base> <shared file>` is the change to mirror.
# `change` says what 1.2 changed relative to the 1.0 text (config/indy3d-v1.2/<TU>.md).
#
# Until 2026-10-18 the layout was the other way round (the shared tree 1.0, these files' 1.2 copies under
# versions/1.2/); the 1.0 copies here are those shared files, moved unchanged.
overlays:
