# Audited external addresses and compiler-pooled constants.
# Whole-TU status is selected in configure.py.
symbols:
  # rdModel3K "Katmai" SSE renderer (0x004E1DA0-0x004E2F30) and Intel's libm floor/ceil/modf: symbols.txt
  # functions of the Intel-compiled TUs Libs/rdroid/Primitives/rdModel3K.c and Libs/intel/libm/*.c.
  # SmushPlay movie player (0x004E30B0-0x004E33F0, Libs/smush/SmushPlay.c; its entry points are symbols.txt
  # functions of that unit), called by
  # JonesMain_Startup (0x0041F002), JonesMain_PlayIntroMovie and JonesMain_Shutdown;
  # addresses read from those retail call destinations. See Libs/smush/SmushPlay.h.
  # Raw statically-linked LIBCMT entry points called directly by
  # stdPlatform.c (VC5 11.00.7022), identified by disassembling the retail
  # image at each call site's real target address. See stdPlatform.md.
  _exit: '0x004F7120'
  __snprintf: '0x004F6C10'
  __vsnprintf: '0x004F6F60'
  # Called directly by sithMulti.c (eight sites) and sithCommand.c; identified the same way, by
  # disassembling the retail image at the call sites' real target address, for example
  # sithMulti_ProcessKilledPlayer's `call 0x004F7A20` at 0x00455F38. 0x004F7A20 is the wide
  # _snwprintf and not _vsnwprintf: it forms the va_list itself (lea edx,[esp+0x30]), doubles the
  # character count for the byte limit (lea ecx,[eax+eax]), sets the 0x42 string-stream flags, calls
  # the shared formatter at 0x004FE4C0 and writes the terminator. See sithMulti.md.
  __snwprintf: '0x004F7A20'
  _malloc: '0x004F8300'
  _free: '0x004F83B0'
  _realloc: '0x004F8690'
  # Called directly by sithString.c (VC5 11.00.7022); identified the same way,
  # by disassembling the retail image at the call site's real target address.
  _strncmp: '0x004F7230'
  # Called directly by stdFnames.c (VC5 11.00.7022); identified by
  # disassembling each retail call site and its real target address.
  _strrchr: '0x004F6AB0'
  # sithControl_FinishRead tail-jumps to stdControl_FinishRead (0x0043FDE5's caller-facing
  # extent); stdControl.c's own compiled body is folded onto rdCanvas_FreeEntry (see `folded:`
  # below), so its retail address is that shared ret-only body's, 0x004EE700.
  _stdControl_FinishRead: '0x004EE700'
  _strncat: '0x004F8400'
  _strncpy: '0x004F65F0'
  # Called directly by stdFileUtil.c (VC5 11.00.7022). Addresses come from
  # the retail call destinations in its exact functions; see stdFileUtil.md.
  _sprintf: '0x004F64B0'
  # sithCogExec_PushStack's overflow shift calls the retail memmove at this address (not the /Oi memcpy intrinsic).
  _memmove: '0x004F75C0'
  __findfirst: '0x004F8CB0'
  __findnext: '0x004F8DE0'
  __findclose: '0x004F8F00'
  # JonesDisplay_SetDefaultVideoMode's "HAL" device search calls the retail strstr at
  # 0x0041280C. The body is unmistakable: it returns the haystack for an empty needle
  # (0x004F6B5A) and tail-jumps a single-character needle into the already-audited _strchr
  # body at 0x004F6536 (_strchr is 0x004F6530). See JonesDisplay.md.
  _strstr: '0x004F6AE0'
  # Sound_GenerateLipSync's 0x200C-byte frame probes the stack: retail's prologue at 0x004DD180
  # is `mov eax,0x200C; call 0x004F9100`. The body at 0x004F9100 is the VC5 CRT stack probe
  # verbatim (push ecx; cmp eax,0x1000; lea ecx,[esp+8]; the 0x1000-step probe loop; mov esp,ecx;
  # then the return-address shuffle `mov ecx,[eax]; mov eax,[eax+4]; push eax; ret`). See Sound.md.
  __chkstk: '0x004F9100'
