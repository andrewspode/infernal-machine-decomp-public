# Statically linked library members (AGENTS.md §7, docs/crt.md).
#
# Retail links these from third-party static libraries; they are not decompiled.
# Each unit is one member of a pinned archive, extracted unmodified by
# `ninja` (pebuild libextract) and verified by the same strict whole-TU matcher
# as a compiled game TU: every section placed at its splits.txt range and, after
# relocation, byte-identical to retail. Units are always selected; they report in
# the objdiff `library` category and in link.json/progress.json `library_units`,
# never as game TUs. A unit is named lib/<library>/<member basename>.
